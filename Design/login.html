<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Tracker - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .login-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
            padding: 40px;
            box-sizing: border-box;
            background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.1), transparent 40%);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo-icon {
            font-size: 64px;
            margin-bottom: 16px;
            display: block;
        }

        .app-title {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, white, #94A3B8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 16px;
            margin-top: 8px;
        }

        .auth-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: transform 0.1s, background 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-google {
            background: white;
            color: #0F172A;
            margin-bottom: 16px;
        }

        .btn-google:active {
            transform: scale(0.98);
            background: #F1F5F9;
        }

        .btn-apple {
            background: rgba(30, 41, 59, 0.6);
            color: white;
            backdrop-filter: blur(10px);
        }

        .divider {
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            margin: 32px 0;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 12px;
        }
    </style>
</head>

<body>
    <div class="device-frame">
        <div class="login-container">
            <div class="logo-area">
                <span class="logo-icon">🎁</span>
                <h1 class="app-title">GiftTracker</h1>
                <p class="tagline">Never forget a gift again.</p>
            </div>

            <button class="auth-btn btn-google" onclick="handleLogin('google')">
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.84z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                Continue with Google
            </button>

            <!-- Optional Apple Login for "Premium" feel -->
            <!-- <button class="auth-btn btn-apple">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05 1.4-3.01.52-1.28-1.09-2.29.35-3.69-.53-.98-.62-1.39-1.54-1.54-2.14-.15-.6 2.02-1.48 2.37-4.43.34-2.91-1.98-3.41-2.12-3.41.14 0 1.6-.74 2.89-.59 1.01.12 1.63.53 2.58.53 1.25 0 2.22-.97 2.22-.97-1.16 3.3.43 4.99 2.53 6.13-.25.82-1.28 3.52-2.23 4.89zM12.03 7.25c-.15 1.77-1.41 3.53-2.98 3.48-1.43-.05-2.87-1.72-2.73-3.48.14-1.63 1.63-3.14 2.92-3.25 1.34-.11 3.06 1.3 2.79 3.25z"/></svg>
                Continue with Apple
            </button> -->

            <p style="text-align: center; color: #64748B; font-size: 13px; margin-top: 32px;">
                By continuing, you agree to our Terms & Privacy Policy.<br>
                (This is a demo, no real auth used)
            </p>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function handleLogin(provider) {
            // Mock Login
            Store.login({
                name: 'Arun Graj',
                email: 'arun@example.com',
                avatar: 'linear-gradient(135deg, #38BDF8, #0EA5E9)'
            });
            window.location.href = 'index.html';
        }

        // Redirect if already logged in
        if (Store.isAuthenticated()) {
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
