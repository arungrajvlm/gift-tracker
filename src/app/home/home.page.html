<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>GiftTracker</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openProfile()">
        <ion-icon slot="icon-only" name="ellipsis-vertical"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar placeholder="Search" (ionInput)="handleSearch($event)" [debounce]="250"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Removed condensed header for cleaner fixed look -->

  <ion-list *ngIf="filteredContacts$ | async as contacts" [inset]="true">
    <ion-item *ngFor="let contact of contacts" [routerLink]="['/detail', contact.id]" detail="true" button lines="full">
      <ion-avatar slot="start" [style.background]="contact.avatarColor">
        <div class="avatar-text">{{ contact.initials }}</div>
      </ion-avatar>

      <ion-label>
        <h2 [innerHTML]="contact.name | highlight:(searchTerm$ | async) || ''"></h2>
        <p>
          <ng-container *ngIf="contact.lastGift; else noActivity">
            <span
              [innerHTML]="(contact.lastGift.type === 'given' ? 'Given: ' : 'Received: ') + contact.lastGift.item | highlight:(searchTerm$ | async) || ''"></span>
          </ng-container>
          <ng-template #noActivity>No activity yet</ng-template>
        </p>
      </ion-label>
    </ion-item>

    <ion-item *ngIf="contacts.length === 0">
      <ion-label class="ion-text-center" color="medium">
        <p>No results found</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="addContact()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
