<ion-header class="ion-no-border">
    <div class="blur-header" style="display: flex; align-items: center; padding: 16px;">
        <ion-icon name="close" style="font-size: 24px; color: #94A3B8;" (click)="cancel()"></ion-icon>
        <h1 style="flex-grow: 1; text-align: center; font-size: 18px; color: white; margin: 0;">New Person</h1>
        <div style="width: 24px;"></div> <!-- Spacer -->
    </div>
</ion-header>

<ion-content class="ion-padding">

    <div class="form-group">
        <label class="form-label">Name</label>
        <ion-input class="custom-input" placeholder="e.g. John Doe" [(ngModel)]="name" autofocus="true">
        </ion-input>
    </div>

    <div class="initial-gift-section">
        <label class="form-label" style="margin-bottom: 16px;">Initial Gift (Optional)</label>

        <!-- Toggle -->
        <div class="toggle-container">
            <button class="toggle-btn" [class.active]="initialGiftType === 'given'"
                [class.given-active]="initialGiftType === 'given'" (click)="initialGiftType = 'given'">
                Given
            </button>
            <button class="toggle-btn" [class.active]="initialGiftType === 'received'"
                [class.received-active]="initialGiftType === 'received'" (click)="initialGiftType = 'received'">
                Received
            </button>
        </div>

        <div class="form-group">
            <ion-input class="custom-input" placeholder="Gift Name or Amount" [(ngModel)]="initialGiftItem">
            </ion-input>
        </div>

        <!-- Date Input (Native) -->
        <div class="form-group">
            <ion-input type="date" class="custom-input date-input" [(ngModel)]="initialGiftDate">
            </ion-input>
        </div>
    </div>

    <ion-button expand="block" class="save-btn" (click)="save()">
        Create Contact
    </ion-button>

</ion-content>
