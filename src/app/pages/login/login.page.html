<ion-content class="ion-padding">
  <div class="ion-text-center ion-margin-top">
    <div style="font-size: 64px;">🎁</div>
    <h1>GiftTracker</h1>
    <p>Simple Gift Tracking</p>
  </div>

  <div class="ion-padding-top ion-margin-top">
    <ion-button expand="block" (click)="login('google')">
      <!-- Standard Ionic icons don't always include logos in basic set, using text for reliability -->
      <ion-icon slot="start" name="logo-google"></ion-icon>
      Login with Google
    </ion-button>

    <ion-button expand="block" fill="outline" class="ion-margin-top" (click)="login('apple')">
      <ion-icon slot="start" name="logo-apple"></ion-icon>
      Login with Apple
    </ion-button>
  </div>
</ion-content>
