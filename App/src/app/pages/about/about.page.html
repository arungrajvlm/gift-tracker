<ion-header class="ion-no-border">
    <ion-toolbar style="--background: #0F172A; --color: white;">
        <ion-buttons slot="start">
            <ion-button (click)="goBack()">
                <ion-icon name="arrow-back"></ion-icon>
            </ion-button>
        </ion-buttons>
        <ion-title>About</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content style="--background: #0F172A;">
    <div class="about-container">
        <div class="logo-section">
            <div class="app-icon">🎁</div>
            <h1>GiftTracker</h1>
            <p class="version">Version 1.0.0</p>
        </div>

        <div class="description">
            <p>
                Never forget a thoughtful gesture again. GiftTracker helps you keep track of gifts given and received,
                ensuring you maintain meaningful connections.
            </p>
        </div>

        <div class="footer">
            <p>Built with ❤️ using Ionic & Angular</p>
        </div>
    </div>
</ion-content>
