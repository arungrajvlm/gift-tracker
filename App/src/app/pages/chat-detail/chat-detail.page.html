<ion-header class="ion-no-border" translucent="true">
    <ion-toolbar class="detail-toolbar">
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/home" class="custom-back-btn"></ion-back-button>
        </ion-buttons>

        <ion-title>{{ contact?.name }}</ion-title>

        <ion-buttons slot="end">
            <ion-button (click)="editName()" class="action-btn">
                <ion-icon name="create-outline" slot="icon-only"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

    <div class="chat-container">
        <ng-container *ngIf="gifts$ | async as gifts">
            <div *ngFor="let gift of gifts; trackBy: trackByGiftId" class="bubble"
                [class.bubble-given]="gift.type === 'given'" [class.bubble-received]="gift.type === 'received'"
                (click)="onGiftClick(gift)">

                <div class="bubble-label">
                    <ion-icon [name]="gift.type === 'given' ? 'arrow-up' : 'arrow-down'"
                        style="font-size: 10px; margin-right: 2px; vertical-align: middle;">
                    </ion-icon>
                    {{ gift.type === 'given' ? 'GIVEN' : 'RECEIVED' }}
                </div>
                <span class="gift-amount">
                    {{ gift.item }}
                </span>
                <span class="gift-note" *ngIf="gift.note">{{ gift.note }}</span>

                <span class="timestamp">{{ gift.date | date:'MMM d, h:mm a' }}</span>
            </div>

            <div *ngIf="gifts.length === 0" class="empty-state">
                <p>No history yet.</p>
            </div>
        </ng-container>
    </div>

    <ion-modal [isOpen]="isModalOpen" (didDismiss)="isModalOpen = false" [initialBreakpoint]="0.75"
        [breakpoints]="[0, 0.75, 1]">
        <ng-template>
            <ion-content class="modal-content">
                <div class="modal-padding-wrapper">

                    <!-- Modal Header with Delete Action -->
                    <div class="modal-header">
                        <h2>{{ editingGiftId ? 'Edit Transaction' : 'New Transaction' }}</h2>
                        <div *ngIf="editingGiftId" class="delete-icon-btn" (click)="deleteGiftFromModal()">
                            <ion-icon name="trash"></ion-icon>
                        </div>
                    </div>

                    <!-- Toggle (Custom Buttons) -->
                    <div class="toggle-container">
                        <button class="toggle-btn" [class.active]="newGiftType === 'received'"
                            [class.received-active]="newGiftType === 'received'" (click)="newGiftType = 'received'">
                            <span style="font-size: 18px; margin-right: 4px;">↓</span> Received
                        </button>
                        <button class="toggle-btn" [class.active]="newGiftType === 'given'"
                            [class.given-active]="newGiftType === 'given'" (click)="newGiftType = 'given'">
                            <span style="font-size: 18px; margin-right: 4px;">↑</span> Given
                        </button>
                    </div>

                    <!-- Inputs -->
                    <div>
                        <label class="form-label">Gift Name or Amount</label>
                        <ion-input class="custom-input" placeholder="e.g. 8g Gold Ring, 2000rs, TV"
                            [(ngModel)]="newGiftItem">
                        </ion-input>
                    </div>

                    <div>
                        <label class="form-label">Note (Optional)</label>
                        <ion-textarea class="custom-input" rows="4" placeholder="Add a few details..."
                            [(ngModel)]="newGiftNote">
                        </ion-textarea>
                    </div>

                    <!-- Date -->
                    <div>
                        <label class="form-label">Date</label>
                        <ion-input type="date" class="custom-input date-input" [(ngModel)]="newGiftDate">
                        </ion-input>
                    </div>

                    <ion-button expand="block" class="save-btn" [class.given]="newGiftType === 'given'"
                        [class.received]="newGiftType === 'received'" (click)="addGift()" [disabled]="!newGiftItem">
                        {{ editingGiftId ? 'Update Gift' : 'Save Gift' }}
                    </ion-button>
                    <!-- Delete button removed from here -->

                </div>
            </ion-content>
        </ng-template>
    </ion-modal>

</ion-content>

<ion-footer class="ion-no-border" mode="ios">
    <div class="footer-actions">
        <button class="footer-btn btn-received" (click)="openModal('received')">
            <span class="badge-icon">
                <ion-icon name="add"></ion-icon>
            </span>
            Received
        </button>
        <button class="footer-btn btn-given" (click)="openModal('given')">
            <span class="badge-icon">
                <ion-icon name="add"></ion-icon>
            </span>
            Given
        </button>
    </div>
</ion-footer>
