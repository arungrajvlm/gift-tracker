<ion-header class="ion-no-border">
    <ion-toolbar style="--background: #0F172A; --color: white;">
        <ion-buttons slot="start">
            <ion-button (click)="goBack()">
                <ion-icon name="arrow-back"></ion-icon>
            </ion-button>
        </ion-buttons>
        <ion-title>Profile</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content style="--background: #0F172A;">
    <div class="profile-container">
        <!-- Hero Section -->
        <div class="hero-section">
            <div class="avatar-container">
                <div class="avatar-ring">
                    <div class="avatar-inner" *ngIf="user$ | async as user; else guestAvatar">
                        <img *ngIf="user.avatar" [src]="user.avatar" alt="Profile" />
                        <span *ngIf="!user.avatar" class="initials">{{ user.name.substring(0,2).toUpperCase() }}</span>
                    </div>
                    <ng-template #guestAvatar>
                        <div class="avatar-inner">
                            <span class="initials">GU</span>
                        </div>
                    </ng-template>
                </div>
                <div class="google-verified-badge" *ngIf="user$ | async">
                    <ion-icon name="logo-google"></ion-icon>
                    <span>GOOGLE</span>
                </div>
            </div>

            <div class="user-info">
                <ng-container *ngIf="user$ | async as user; else guestUser">
                    <h2>{{ user.name }}</h2>
                    <div class="email-badge-container">
                        <p class="email">{{ user.email }}</p>
                        <div class="google-badge">
                            <ion-icon name="logo-google"></ion-icon>
                        </div>
                    </div>
                </ng-container>
                <ng-template #guestUser>
                    <h2>Guest User</h2>
                </ng-template>
                <p class="member-since">Member since 2026</p>
            </div>
        </div>

        <!-- Premium Stats -->
        <div class="premium-stats" *ngIf="stats$ | async as stats">
            <div class="stat-box">
                <div class="stat-value">{{ stats.given }}</div>
                <div class="stat-label">Given</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-box">
                <div class="stat-value">{{ stats.received }}</div>
                <div class="stat-label">Received</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-box">
                <div class="stat-value">${{ stats.totalValue }}</div>
                <div class="stat-label">Value</div>
            </div>
        </div>

        <!-- Settings Menu -->
        <div class="settings-group">
            <div class="group-title">Account Settings</div>

            <div class="setting-item" (click)="showComingSoon('Notifications')">
                <div class="setting-icon notifications">
                    <ion-icon name="notifications"></ion-icon>
                </div>
                <div class="setting-label">Notifications</div>
                <ion-toggle checked class="custom-toggle" (click)="$event.stopPropagation()"></ion-toggle>
            </div>

            <div class="setting-item" (click)="showComingSoon('Security Settings')">
                <div class="setting-icon security">
                    <ion-icon name="shield-checkmark"></ion-icon>
                </div>
                <div class="setting-label">Security</div>
                <ion-icon name="chevron-forward" class="chevron"></ion-icon>
            </div>
        </div>

        <div class="settings-group">
            <div class="group-title">Support</div>

            <div class="setting-item" (click)="showComingSoon('Help Center')">
                <div class="setting-icon help">
                    <ion-icon name="chatbubble-ellipses"></ion-icon>
                </div>
                <div class="setting-label">Help & Feedback</div>
                <ion-icon name="chevron-forward" class="chevron"></ion-icon>
            </div>
        </div>

    </div>
</ion-content>
