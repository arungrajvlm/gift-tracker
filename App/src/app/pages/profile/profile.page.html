<ion-header class="ion-no-border">
    <ion-toolbar style="--background: #0F172A; --color: white;">
        <ion-buttons slot="start">
            <ion-button (click)="goBack()">
                <ion-icon name="arrow-back"></ion-icon>
            </ion-button>
        </ion-buttons>
        <ion-title>Profile</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content style="--background: #0F172A;">
    <div class="profile-container">
        <!-- Hero Section -->
        <div class="hero-section">
            <div class="avatar-container">
                <div class="avatar-ring">
                    <div class="avatar-inner">
                        <span class="initials">AG</span>
                    </div>
                </div>
                <div class="premium-badge">
                    <ion-icon name="star"></ion-icon>
                    <span>PRO</span>
                </div>
            </div>

            <div class="user-info">
                <h2 *ngIf="user$ | async as user; else guestUser">{{ user.email || 'Arun G Raj' }}</h2>
                <ng-template #guestUser>
                    <h2>Guest User</h2>
                </ng-template>
                <p class="member-since">Member since 2026</p>
            </div>
        </div>

        <!-- Premium Stats -->
        <div class="premium-stats" *ngIf="stats$ | async as stats">
            <div class="stat-box">
                <div class="stat-value">{{ stats.given }}</div>
                <div class="stat-label">Given</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-box">
                <div class="stat-value">{{ stats.received }}</div>
                <div class="stat-label">Received</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-box">
                <div class="stat-value">${{ stats.totalValue }}</div>
                <div class="stat-label">Value</div>
            </div>
        </div>

        <!-- Settings Menu -->
        <div class="settings-group">
            <div class="group-title">Account Settings</div>

            <div class="setting-item">
                <div class="setting-icon notifications">
                    <ion-icon name="notifications"></ion-icon>
                </div>
                <div class="setting-label">Notifications</div>
                <ion-toggle checked class="custom-toggle"></ion-toggle>
            </div>

            <div class="setting-item">
                <div class="setting-icon security">
                    <ion-icon name="shield-checkmark"></ion-icon>
                </div>
                <div class="setting-label">Security</div>
                <ion-icon name="chevron-forward" class="chevron"></ion-icon>
            </div>
        </div>

        <div class="settings-group">
            <div class="group-title">Support</div>

            <div class="setting-item">
                <div class="setting-icon help">
                    <ion-icon name="chatbubble-ellipses"></ion-icon>
                </div>
                <div class="setting-label">Help & Feedback</div>
                <ion-icon name="chevron-forward" class="chevron"></ion-icon>
            </div>
        </div>

    </div>
</ion-content>
