<ion-header class="ion-no-border">
  <div class="blur-header">
    <div class="header-title-container">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 24px;">🎁</span>
        <h1>GiftTracker</h1>
      </div>
      <div class="menu-btn" (click)="toggleMenu()">
        <!-- Toggle Icon changed to Close when open -->
        <ion-icon [name]="isMenuOpen ? 'close' : 'menu'"></ion-icon>
      </div>

      <!-- Custom Premium Menu -->
      <div class="menu-overlay" *ngIf="isMenuOpen" (click)="toggleMenu()">
        <div class="menu-content" (click)="$event.stopPropagation()">
          <div class="menu-item" (click)="openProfile()">
            <ion-icon name="person"></ion-icon>
            <span>Profile</span>
          </div>
          <div class="menu-item" (click)="openAbout()">
            <ion-icon name="help-circle"></ion-icon>
            <span>About</span>
          </div>
          <div class="menu-divider"></div>
          <div class="menu-item danger" (click)="logout()">
            <ion-icon name="log-out-outline"></ion-icon>
            <span>Log Out</span>
          </div>
          <div class="menu-divider"></div>
          <div class="menu-item" (click)="seedData()" style="color: #FBBF24;">
            <ion-icon name="construct" style="color: #FBBF24;"></ion-icon>
            <span>Seed Data</span>
          </div>
        </div>
      </div>
    </div>

    <div class="search-container">
      <div class="custom-search">
        <ion-icon name="search"></ion-icon>
        <input type="text" placeholder="Search people..." (input)="onSearch($event)" [value]="searchTerm">
      </div>
    </div>
  </div>
</ion-header>

<ion-content>
  <div class="contact-list">

    <!-- Skeleton Loader -->
    <div class="skeleton-list" *ngIf="isLoading">
      <div class="contact-item" *ngFor="let item of [1,2,3,4,5,6,7,8]">
        <ion-skeleton-text animated
          style="width: 48px; height: 48px; border-radius: 50%; margin-right: 16px;"></ion-skeleton-text>
        <div style="flex: 1;">
          <ion-skeleton-text animated
            style="width: 60%; height: 20px; margin-bottom: 8px; border-radius: 4px;"></ion-skeleton-text>
          <ion-skeleton-text animated style="width: 40%; height: 16px; border-radius: 4px;"></ion-skeleton-text>
        </div>
      </div>
    </div>

    <div class="real-list" *ngIf="!isLoading">

      <div class="contact-item ion-activatable" *ngFor="let contact of displayedContacts; trackBy: trackByContact"
        (click)="openChat(contact.id)">
        <ion-ripple-effect></ion-ripple-effect>
        <div class="avatar" [style.background]="contact.avatarColor">
          {{ contact.initials }}
        </div>
        <div class="info">
          <span class="name" [innerHTML]="contact.name | highlight:searchTerm"></span>
          <div class="details">
            <span *ngIf="contact.lastGift">
              {{ contact.lastGift.type === 'given' ? 'Given' : 'Received' }}:
              <span [innerHTML]="contact.lastGift.item | highlight:searchTerm"></span>
            </span>
            <span *ngIf="!contact.lastGift">No gifts yet</span>

            <span *ngIf="contact.lastGift">{{ contact.lastGift.date | date:'MMM d' }}</span>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div class="empty-state" *ngIf="allFilteredContacts.length === 0">
        <div class="empty-icon">🎁</div>
        <p class="empty-title">No contacts found</p>
        <p class="empty-subtitle">Add a new person to start gifting!</p>
      </div>

      <ion-infinite-scroll threshold="25%" (ionInfinite)="loadData($event)">
        <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Loading more...">
        </ion-infinite-scroll-content>
      </ion-infinite-scroll>

    </div>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="design-fab">
    <ion-fab-button (click)="addContact()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
